<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LG TV Remote</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Extension Header -->
  <header class="ext-header">
    <div class="ext-brand">
      <div class="ext-logo">LG</div>
      <div>
        <h1 id="ext-title">LG TV Remote</h1>
        <div class="ext-status">
          <span class="status-dot" id="ext-status-dot"></span>
          <span id="ext-status-text">Connecting...</span>
        </div>
      </div>
    </div>

    <div class="header-tools">
      <button class="tool-btn" id="btn-cast-tab" title="Cast Current Tab to LG TV">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
          <polyline points="17 2 12 7 7 2"></polyline>
        </svg>
        Cast Tab
      </button>

      <button class="icon-tool-btn" id="btn-side-panel" title="Pin to Side Panel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Server Offline Alert Banner -->
  <div class="offline-banner" id="ext-offline-banner" style="display: none;">
    <span>⚠️ Server offline! Run <code>python3 server.py</code></span>
  </div>

  <!-- Remote Body -->
  <main class="remote-body">

    <!-- Top Row: Power & Controls -->
    <div class="top-row">
      <button class="btn-wol" id="btn-power-on" title="Power ON (Wake-on-LAN)">
        ⚡ Power ON
      </button>

      <button class="btn-power-off" id="btn-power-off" title="Turn TV OFF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Quick Pill Buttons: Menu, Mute, Info -->
    <div class="quick-row">
      <button class="pill-btn" data-key="MENU">Menu</button>
      <button class="pill-btn" id="btn-toggle-mute">
        <span id="mute-label">Mute</span>
      </button>
      <button class="pill-btn" data-key="INFO">Info</button>
    </div>

    <!-- Tactile D-Pad -->
    <div class="dpad-wrapper">
      <div class="dpad">
        <button class="dpad-btn dpad-up" data-key="UP" title="Up">▲</button>
        <button class="dpad-btn dpad-down" data-key="DOWN" title="Down">▼</button>
        <button class="dpad-btn dpad-left" data-key="LEFT" title="Left">◄</button>
        <button class="dpad-btn dpad-right" data-key="RIGHT" title="Right">►</button>
        <button class="dpad-center" data-key="ENTER" title="OK / Select">OK</button>
      </div>
    </div>

    <!-- Nav Row: Back, Home, Exit -->
    <div class="nav-row">
      <button class="nav-btn" data-key="BACK">Back</button>
      <button class="nav-btn" data-key="HOME">Home</button>
      <button class="nav-btn" data-key="EXIT">Exit</button>
    </div>

    <!-- Rockers: Volume & Channel -->
    <div class="rockers-row">
      <!-- Volume Rocker -->
      <div class="rocker">
        <button class="rocker-btn" id="btn-vol-up">+</button>
        <div class="rocker-label">
          <span>VOL</span>
          <span class="vol-num" id="vol-num">15</span>
        </div>
        <button class="rocker-btn" id="btn-vol-down">-</button>
      </div>

      <!-- Channel Rocker -->
      <div class="rocker">
        <button class="rocker-btn" id="btn-ch-up">▲</button>
        <div class="rocker-label">
          <span>CH</span>
          <span>▲▼</span>
        </div>
        <button class="rocker-btn" id="btn-ch-down">▼</button>
      </div>
    </div>

    <!-- Volume Slider Bar -->
    <div class="volume-bar">
      <span>🔈</span>
      <input type="range" id="vol-slider" min="0" max="100" value="15">
      <span id="vol-slider-val">15%</span>
    </div>

    <!-- Media Controls -->
    <div class="media-row">
      <button class="media-btn" id="btn-rewind" title="Rewind">⏪</button>
      <button class="media-btn play-btn" id="btn-play-pause" title="Play/Pause">▶ / ⏸</button>
      <button class="media-btn" id="btn-stop" title="Stop">⏹</button>
      <button class="media-btn" id="btn-fastforward" title="Fast Forward">⏩</button>
    </div>

    <!-- Color Buttons -->
    <div class="color-row">
      <button class="color-btn red" data-key="RED"></button>
      <button class="color-btn green" data-key="GREEN"></button>
      <button class="color-btn yellow" data-key="YELLOW"></button>
      <button class="color-btn blue" data-key="BLUE"></button>
    </div>

    <!-- Secondary Tabs -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="tab-apps">Apps</button>
      <button class="tab-btn" data-tab="tab-touchpad">Touchpad</button>
      <button class="tab-btn" data-tab="tab-numpad">123</button>
      <button class="tab-btn" data-tab="tab-tools">Tools</button>
    </div>

    <!-- Tab 1: Apps Grid -->
    <div class="tab-pane active" id="tab-apps">
      <div class="apps-grid" id="apps-list">
        <p class="placeholder-text">Loading TV apps...</p>
      </div>
    </div>

    <!-- Tab 2: Touchpad -->
    <div class="tab-pane" id="tab-touchpad">
      <div class="touchpad" id="touchpad-area">
        <p>Swipe or drag to steer TV pointer</p>
      </div>
      <div class="touchpad-btns">
        <button class="nav-btn" id="btn-touchpad-click">Click</button>
        <button class="nav-btn" data-key="BACK">Back</button>
      </div>
    </div>

    <!-- Tab 3: Number Pad -->
    <div class="tab-pane" id="tab-numpad">
      <div class="numpad-grid">
        <button class="num-btn" data-key="1">1</button>
        <button class="num-btn" data-key="2">2</button>
        <button class="num-btn" data-key="3">3</button>
        <button class="num-btn" data-key="4">4</button>
        <button class="num-btn" data-key="5">5</button>
        <button class="num-btn" data-key="6">6</button>
        <button class="num-btn" data-key="7">7</button>
        <button class="num-btn" data-key="8">8</button>
        <button class="num-btn" data-key="9">9</button>
        <button class="num-btn" data-key="DASH">-</button>
        <button class="num-btn" data-key="0">0</button>
        <button class="num-btn" data-key="ENTER">OK</button>
      </div>
    </div>

    <!-- Tab 4: Smart Tools -->
    <div class="tab-pane" id="tab-tools">
      <div class="tool-field">
        <label for="toast-msg">Send Toast Notification</label>
        <div class="field-row">
          <input type="text" id="toast-msg" placeholder="Message on TV..." value="Hello from Chrome!">
          <button class="btn-primary" id="btn-send-toast">Send</button>
        </div>
      </div>

      <div class="tool-field">
        <label for="tv-url">Open URL on TV Browser</label>
        <div class="field-row">
          <input type="url" id="tv-url" placeholder="https://..." value="https://youtube.com">
          <button class="btn-primary" id="btn-open-tv-url">Open</button>
        </div>
      </div>
    </div>

  </main>

  <script src="popup.js"></script>
</body>
</html>
